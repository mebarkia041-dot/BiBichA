name: Build Emilia Android APK
on:
  push:
    branches: ["main"]
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/android.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build safe-install release APK
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify APK package, version and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          BADGING="$($ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK")"
          echo "$BADGING"
          grep -F "package: name='com.emilia.assistant' versionCode='7' versionName='1.0.6'" <<< "$BADGING"
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose "$APK"
          sha256sum "$APK"
      - name: Upload installable release APK
        uses: actions/upload-artifact@v4
        with:
          name: Emilia-Android-Safe-Install-1.0.6
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
