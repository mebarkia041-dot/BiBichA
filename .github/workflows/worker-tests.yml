name: BiBichA Worker Tests
on:
  push:
    branches: ["main"]
    paths:
      - "worker/**"
      - ".github/workflows/worker-tests.yml"
  pull_request:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  worker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run Worker tests
        run: node --test worker/test/*.test.mjs
