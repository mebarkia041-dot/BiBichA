<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#8b5cf6"><link rel="manifest" href="./manifest.json">
<title>BiBichA</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;background:#f7f3ff;color:#241b35;min-height:100vh;display:flex;justify-content:center}
.app{width:100%;max-width:520px;height:100dvh;background:#fff;display:flex;flex-direction:column;box-shadow:0 0 35px #32145b12}
header{padding:18px;background:linear-gradient(135deg,#8b5cf6,#d946ef);color:white;text-align:center}
header h1{margin:0;font-size:27px}header p{margin:5px 0 0;font-size:13px;opacity:.9}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;padding:9px 12px;border-bottom:1px solid #eee}
.toolbar button{flex:1 1 28%;min-width:0;min-height:42px;background:#f1eaff;color:#6d28d9;padding:9px 7px;border-radius:12px;font-size:13px}
#messages{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.msg{padding:12px 15px;border-radius:18px;max-width:88%;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.bot{background:#f1eaff;align-self:flex-start;border-bottom-right-radius:5px}
.user{background:#8b5cf6;color:white;align-self:flex-end;border-bottom-left-radius:5px}
form{display:flex;gap:8px;padding:12px;border-top:1px solid #eee}
input{flex:1;min-width:0;border:1px solid #ddd;border-radius:24px;padding:13px;font-size:16px;outline:none}
button{border:0;border-radius:24px;padding:0 16px;background:#8b5cf6;color:#fff;font-size:15px;cursor:pointer}
.note{font-size:11px;color:#8a8195;text-align:center;padding:0 10px 10px}
#connection{font-size:12px;text-align:center;padding:6px;color:#8a8195;background:#faf8ff}
</style></head>
<body><main class="app">
<header><h1>💜 BiBichA</h1><p>بيبيشا • سارة • وحيدتي</p></header>
<div class="toolbar"><button type="button" id="install" hidden>📲 تثبيت بيبيشا</button><button type="button" id="voice">🎙️ تحدث</button><button type="button" id="speak">🔊 قراءة الرد</button><button type="button" id="autoVoice">🔈 الصوت التلقائي: متوقف</button><button type="button" id="memoryBtn">🧠 الذاكرة</button><button type="button" id="backup">💾 نسخة احتياطية</button><button type="button" id="restore">📥 استرجاع</button><input id="restoreFile" type="file" accept="application/json,.json" hidden><button type="button" id="clear">مسح المحادثة</button></div>
<section id="messages" aria-live="polite"></section>
<form id="chat"><input id="entry" placeholder="اكتب رسالتك هنا..." autocomplete="off" required><button type="submit">إرسال</button></form>
<div id="connection" role="status">حالة الاتصال: جاري الفحص...</div>
<div class="note">تحفظ المحادثة على هذا الهاتف. دون إعداد الخادم الآمن، تعمل بيبيشا بالردود التجريبية؛ بعد ربط الخادم تتحدث معك بالذكاء الاصطناعي عبر الإنترنت.</div>
</main>
<script src="./api-config.js"></script>
<script>
const box=document.getElementById('messages'),form=document.getElementById('chat'),entry=document.getElementById('entry');
let installPrompt=null;const installBtn=document.getElementById('install');window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;installBtn.hidden=false;});installBtn.addEventListener('click',async()=>{if(!installPrompt){add('bot','إذا ما ظهرش خيار التثبيت، افتح قائمة المتصفح واختر «إضافة إلى الشاشة الرئيسية».');return;}installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;installBtn.hidden=true;});window.addEventListener('appinstalled',()=>{installBtn.hidden=true;add('bot','مرحبا بيك! بيبيشا تثبتت في هاتفك ❤️');});
let history=[];
try{const saved=JSON.parse(localStorage.getItem('bibicha-chat')||'[]');history=Array.isArray(saved)?saved.filter(x=>x&&['user','bot'].includes(x.role)&&typeof x.text==='string').map(x=>({role:x.role,text:x.text.slice(0,10000)})).slice(-100):[];}catch(e){history=[];}
let memory={facts:[]};
try{memory=JSON.parse(localStorage.getItem('bibicha-memory')||'{"facts":[]}');if(!memory||!Array.isArray(memory.facts))memory={facts:[]};else memory={facts:memory.facts.filter(x=>typeof x==='string').map(x=>x.trim().slice(0,500)).filter(Boolean).slice(-30)};}catch(e){memory={facts:[]};}
let autoVoice=localStorage.getItem('bibicha-auto-voice')==='1';
const autoVoiceBtn=document.getElementById('autoVoice');
function refreshVoiceButton(){autoVoiceBtn.textContent=autoVoice?'🔊 الصوت التلقائي: يعمل':'🔈 الصوت التلقائي: متوقف';}
refreshVoiceButton();
function apiBase(){
 return (window.BIBICHA_API_URL||'').trim().replace(/\/+$/,'').replace(/\/chat$/i,'');
}
function chatEndpoint(){const base=apiBase();return base?base+'/chat':'';}
async function checkBackend(){
 const base=apiBase();
 const status=document.getElementById('connection');
 if(!base){status.textContent='حالة الاتصال: الذكاء الاصطناعي غير مربوط بعد';return;}
 try{
  const res=await fetch(base+'/health',{method:'GET',cache:'no-store'});
  const data=await res.json();
  status.textContent=res.ok&&data.configured?'حالة الاتصال: الخادم متاح والمفتاح موجود؛ جرّب إرسال رسالة للتأكد من عمل API ❤️':'حالة الاتصال: الخادم موجود لكن مفتاح API غير مضبوط';
 }catch(e){status.textContent='حالة الاتصال: تعذر الوصول إلى الخادم؛ تحقق من الرابط والإنترنت';}
}
checkBackend();
function say(text){if(!('speechSynthesis'in window))return;const u=new SpeechSynthesisUtterance(text);u.lang='ar-DZ';u.rate=.94;u.pitch=1.08;speechSynthesis.cancel();speechSynthesis.speak(u);}
autoVoiceBtn.addEventListener('click',()=>{autoVoice=!autoVoice;localStorage.setItem('bibicha-auto-voice',autoVoice?'1':'0');refreshVoiceButton();if(autoVoice)say('الصوت التلقائي راه يخدم الآن ❤️');});
function saveMemory(){try{localStorage.setItem('bibicha-memory',JSON.stringify(memory));}catch(e){}}
function rememberFromMessage(value){
 const q=value.trim();
 if(/^(احذف الذاكرة|امسح الذاكرة|انسى كل ما حفظت)/.test(q)){memory={facts:[]};saveMemory();return 'تم مسح المعلومات المحفوظة من هذا الهاتف.';}
 if(/^(تذكر|احفظ|خلي في بالك|ما تنساش)/.test(q)){
  const fact=q.replace(/^(تذكر|احفظ|خلي في بالك|ما تنساش)[:، ]*/,'').trim();
  if(fact){memory.facts=[...memory.facts.filter(x=>x!==fact),fact].slice(-30);saveMemory();return 'حفظت هذي المعلومة في ذاكرتي على هذا الهاتف ❤️';}
 }
 return '';
}
function add(role,text,save=true){const m=document.createElement('div');m.className='msg '+role;m.textContent=text;box.appendChild(m);box.scrollTop=box.scrollHeight;if(save){history.push({role,text});try{localStorage.setItem('bibicha-chat',JSON.stringify(history.slice(-100)));}catch(e){}}if(role==='bot'&&autoVoice)say(text);}
function reply(q){const s=q.toLowerCase();if(/سلام|salam|مرحبا|bonjour/.test(s))return 'وعليكم السلام ❤️ أنا بيبيشا، راني هنا معاك.';if(/اسمك|شكون|من انت/.test(s))return 'أنا بيبيشا، وتقدر تناديني سارة أو وحيدتي 💜';if(/شكرا|merci/.test(s))return 'بلا مزية يا الغالي ❤️';if(/كيف حالك|واش راكي/.test(s))return 'لاباس الحمد لله، وفرحانة نهدر معاك 😊';if(/نحبك|احبك/.test(s))return 'كلامك حنون ❤️ أنا هنا باش نعاونك ونسمعلك.';return 'وصلتني رسالتك ❤️ حالياً هذي نسخة أولية بردود بسيطة دون إنترنت. الذكاء الاصطناعي الحقيقي مازال يحتاج ربط آمن بخدمة API.';}
if(history.length){history.forEach(x=>add(x.role,x.text,false));}else add('bot','سلام ❤️ أنا بيبيشا. اكتبلّي واش حاب، ونبدأو مع بعض.');
form.addEventListener('submit',async e=>{
 e.preventDefault();
 const v=entry.value.trim();if(!v)return;
 const previous=history.slice(-12);
 const memoryNotice=rememberFromMessage(v);
 add('user',v);entry.value='';
 if(memoryNotice){add('bot',memoryNotice);return;}
 const send=form.querySelector('button[type="submit"]');send.disabled=true;send.textContent='...';
 try{
   const endpoint=chatEndpoint();
   if(!endpoint){add('bot',reply(v));return;}
   const context=previous.map(x=>({role:x.role==='user'?'user':'assistant',content:x.text}));
   const response=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:v,history:context,memory:memory.facts}),signal:AbortSignal.timeout(35000)});
   const data=await response.json().catch(()=>({}));

   if(!response.ok)throw new Error(data.error||'تعذر الاتصال بالخادم.');
   add('bot',data.reply||'ما وصلنيش رد. عاود المحاولة.');
 }catch(err){add('bot',err.name==='TimeoutError'?'الخادم تأخر في الرد. تحقق من الاتصال وحاول مرة أخرى.':(err.message||'ما قدرتش نتصل بالخادم حالياً. تحقق من الإنترنت وإعدادات الربط.'));}
 finally{send.disabled=false;send.textContent='إرسال';entry.focus();}
});
document.getElementById('clear').addEventListener('click',()=>{history=[];localStorage.removeItem('bibicha-chat');box.innerHTML='';add('bot','رجعنا صفحة جديدة ❤️ ذاكرتي المحفوظة تبقى. أنا بيبيشا، واش نحكيو اليوم؟');});
document.getElementById('memoryBtn').addEventListener('click',()=>{
 const facts=memory.facts.length?memory.facts.map((x,i)=>(i+1)+'. '+x).join('\n'):'مازال ما حفظتش حتى معلومة.';
 const action=confirm('ذاكرة بيبيشا (محفوظة على هذا الهاتف):\n\n'+facts+'\n\nاضغط موافق لمسح الذاكرة كاملة، أو إلغاء للاحتفاظ بها.');
 if(action){memory={facts:[]};saveMemory();add('bot','مسحت الذاكرة المحفوظة من هذا الهاتف.');}
});
document.getElementById('backup').addEventListener('click',()=>{
 const data={app:'BiBichA',version:1,exportedAt:new Date().toISOString(),history,memory};
 const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
 const url=URL.createObjectURL(blob);const a=document.createElement('a');
 a.href=url;a.download='bibicha-backup-'+new Date().toISOString().slice(0,10)+'.json';
 document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
 add('bot','حضّرتلك نسخة احتياطية من المحادثة والذاكرة. احتفظ بالملف في مكان آمن ❤️');
});
const restoreFile=document.getElementById('restoreFile');
document.getElementById('restore').addEventListener('click',()=>restoreFile.click());
restoreFile.addEventListener('change',async()=>{
 const file=restoreFile.files&&restoreFile.files[0];if(!file)return;
 try{
  if(file.size>2*1024*1024)throw new Error('الملف كبير بزاف.');
  const data=JSON.parse(await file.text());
  if(!data||data.app!=='BiBichA'||!Array.isArray(data.history)||!data.memory||!Array.isArray(data.memory.facts))throw new Error('هذا الملف ماشي نسخة احتياطية صالحة لبيبيشا.');
  history=data.history.filter(x=>x&&['user','bot'].includes(x.role)&&typeof x.text==='string').map(x=>({role:x.role,text:x.text.slice(0,10000)})).slice(-100);
  memory={facts:data.memory.facts.filter(x=>typeof x==='string').map(x=>x.trim().slice(0,500)).filter(Boolean).slice(-30)};
  localStorage.setItem('bibicha-chat',JSON.stringify(history));
  saveMemory();box.innerHTML='';history.forEach(x=>add(x.role,x.text,false));
  add('bot','تم استرجاع النسخة الاحتياطية بنجاح ❤️');
 }catch(err){add('bot',err.message||'تعذر استرجاع النسخة.');}
 finally{restoreFile.value='';}
});
document.getElementById('speak').addEventListener('click',()=>{const last=[...box.querySelectorAll('.bot')].pop();if(last)say(last.textContent);});
document.getElementById('voice').addEventListener('click',()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){add('bot','التعرف على الصوت غير مدعوم في هذا المتصفح. استعمل الكتابة حالياً.');return;}const r=new SR();r.lang='ar-DZ';r.onresult=e=>{entry.value=e.results[0][0].transcript;form.requestSubmit();};r.onerror=()=>add('bot','ما قدرتش نسمعك. جرّب مرة أخرى أو اكتب رسالتك.');r.start();});
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
window.addEventListener('online',()=>add('bot','رجع الاتصال بالإنترنت ❤️'));window.addEventListener('offline',()=>add('bot','راك خارج الإنترنت حالياً. المحادثة المحفوظة والواجهة يبقاو متاحين ❤️'));
</script></body></html>
